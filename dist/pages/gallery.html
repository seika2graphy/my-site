<!-- 拡大表示用モーダル（写真・藍のどちらもクリックで連動） -->
<div id="lightbox-modal" class="lightbox" onclick="closeLightbox(event)">
    <button type="button" class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <div class="lightbox-content">

        >

<script>
    const ITEMS_PER_PAGE = 12; // 1回あたりの最大表示数
    let currentFilter = 'all';
    let visibleCount = ITEMS_PER_PAGE;

    const tabs = document.querySelectorAll('.tab-button');
    const items = Array.from(document.querySelectorAll('.gallery-item'));
    const loadMoreContainer = document.getElementById('load-more-container');
    const loadMoreBtn = document.getElementById('load-more-btn');

    // フィルタと件数に応じた表示更新
    function updateGallery() {
        // 現在のタブに該当する要素を抽出
        const matchedItems = items.filter(item => {
            return currentFilter === 'all' || item.dataset.category === currentFilter;
        });

        // いったんすべての要素に非表示クラスを付与
        items.forEach(item => item.classList.add('is-hidden'));

        // 該当要素のうち visibleCount 件までを表示
        matchedItems.slice(0, visibleCount).forEach(item => {
            item.classList.remove('is-hidden');
        });

        // 残りがある場合のみ「もっと見る」ボタンを表示
        if (matchedItems.length > visibleCount) {
            loadMoreContainer.style.display = 'block';
        } else {
            loadMoreContainer.style.display = 'none';
        }
    }

    // タブ切り替え処理
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            currentFilter = tab.dataset.filter;
            visibleCount = ITEMS_PER_PAGE; // タブ変更時は最初の12件にリセット
            updateGallery();
        });
    });

    // 「もっと見る」ボタンのクリックイベント
    loadMoreBtn.addEventListener('click', () => {
        visibleCount += ITEMS_PER_PAGE;
        updateGallery();
    });

    // ページ読み込み時に初期描画を実行
    updateGallery();

    // ライトボックス制御（写真・藍の両方の .photo-item を対象）
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');
    const photoItems = document.querySelectorAll('.photo-item');

    photoItems.forEach(item => {
        item.addEventListener('click', () => {
            const displaySrc = item.getAttribute('data-display');
            if (displaySrc) {
                modalImg.src = displaySrc;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });
    });

    function closeLightbox(e) {
        if (e.target.closest('.lightbox-content')) return;
        modal.classList.remove('active');
        modalImg.src = '';
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            modal.classList.remove('active');
            modalImg.src = '';
            document.body.style.overflow = '';
        }
    });
</script>
