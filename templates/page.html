<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site_title }}</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1 class="site-logo">
            <a href="../index.html">
                <img src="../images/logo.png" alt="{{ site_title }}">
            </a>
        </h1>
    </header>

    <main class="page-single">
        <header class="page-header">
            <h1>{{ page.title }}</h1>
        </header>

        {% if page.image %}
        <div class="article-hero">
            <img src="../images/{{ page.image }}" alt="{{ page.title }}">
        </div>
        {% endif %}

        <div class="article-body">
            {{ page.body | safe }}
        </div>

        <div class="article-footer-nav">
            <a href="../index.html" class="back-link">&larr; Homeへ戻る</a>
        </div>
    </main>

    <footer>
        <p>&copy; {{ site_title }}</p>
    </footer>

</body>
</html>
