<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活の写真</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="site-logo">
            <a href="index.html">
                <img src="images/logo.png" alt="生活の写真">
            </a>
        </h1>
    </header>

    <main>
        <!-- 16:9のメイン画像枠 -->
        <div class="hero-wrapper">
            <div class="hero-container">
                <img id="hero-image" alt="Featured Photo">
            </div>
        </div>

        <!-- ★追加: 画像下のナビゲーションメニュー -->
        <nav class="top-nav-section">
            <ul class="top-nav-list">
                <li><a href="pages/about.html">アトリエについて</a></li>
                <li><a href="pages/gallery.html">ギャラリー</a></li>
                <li><a href="https://www.creema.jp/c/seika2graphy" target="_blank" rel="noopener noreferrer">ウェブショップ</a></li>
                <li><a href="pages/contact.html">お問合せ</a></li>
            </ul>
        </nav>

        <!-- お知らせセクション -->
        
        <section class="news-section">
            <h2>お知らせ</h2>
            <ul class="news-list">
                
                <li>
                    <a href="news/first-post.html">
                        <time>2026-11-08</time>
                        <span>リニューアル</span>
                    </a>
                </li>
                
            </ul>
        </section>
        
    </main>
    <footer>
        <p>&copy; 生活の写真</p>
    </footer>

    <!-- 写真をランダム選択する小さなスクリプト -->
    <script>
        const heroPhotos = ["22300005-2048x1358.jpg", "cropped-DSCF8278-1-scaled-1-1920x1080.jpg", "cropped-DSCF8408-1-scaled-1-1536x863.jpg", "cropped-lia_153-1-scaled-1-1920x1080.jpg", "DSCF8278-1-2048x1365.jpg", "KawamuraAnna_20231012_0106a-2048x1365.jpg"];

        if (heroPhotos && heroPhotos.length > 0) {
            const randomPhoto = heroPhotos[Math.floor(Math.random() * heroPhotos.length)];
            const imgElement = document.getElementById('hero-image');

            imgElement.src = 'hero_photos/' + randomPhoto;
            
            imgElement.onload = () => {
                imgElement.classList.add('loaded');
            };
        }
    </script>
</body>
</html>
