{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site_title }}{% endblock %}

{% block content %}
<main class="gallery-page">
    <header class="page-header">
        <h1>{{ page.title }}</h1>
    </header>

    {% if page.body %}
    <div class="gallery-intro">
        {{ page.body | safe }}
    </div>
    {% endif %}

    <!-- 写真グリッド（サムネイルは16:9のthumb、拡大用URLをdata-displayに保持） -->
    <div class="photo-grid">
        {% for photo in gallery_photos %}
        <div class="photo-item" data-display="/gallery_photos/{{ photo.display }}">
            <img 
                src="/gallery_photos/{{ photo.thumb }}" 
                alt="{{ photo.title }}" 
                loading="lazy"
                class="protect-img gallery-thumb"
                oncontextmenu="return false;"
                ondragstart="return false;"
            >
        </div>
        {% endfor %}
    </div>

    <div class="article-footer-nav">
        <a href="/" class="back-link">&larr; ホームへ戻る</a>
    </div>
</main>

<!-- 拡大表示用モーダル（ライトボックス） -->
<div id="lightbox-modal" class="lightbox" onclick="closeLightbox(event)">
    <button type="button" class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <div class="lightbox-content">
        <img 
            id="lightbox-img" 
            src="" 
            alt="Enlarged Photo"
            class="protect-img"
            oncontextmenu="return false;"
            ondragstart="return false;"
        >
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- ライトボックス制御スクリプト -->
<script>
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');
    const photoItems = document.querySelectorAll('.photo-item');

    photoItems.forEach(item => {
        item.addEventListener('click', () => {
            // data-display にある高解像度表示用WebPをモーダルにセット
            const displaySrc = item.getAttribute('data-display');
            if (displaySrc) {
                modalImg.src = displaySrc;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });
    });

    function closeLightbox(e) {
        if (e.target.closest('.lightbox-content')) return;
        modal.classList.remove('active');
        modalImg.src = '';
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            modal.classList.remove('active');
            modalImg.src = '';
            document.body.style.overflow = '';
        }
    });
</script>
{% endblock %}
